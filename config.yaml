# =========================================================
# 自動瀏覽職缺設定
# =========================================================

# 每一個 LOG 最多寫入多少筆職缺
log_max_jobs: 1000

# 單次執行最多收集多少筆職缺
max_jobs: 1000

# 搜尋職缺列表時，最多掃描多少頁
max_pages: 100


# =========================================================
# 報表分析設定
# =========================================================

report:

  # 技術排行榜顯示前幾名
  technology_top_n: 20

  # 行政區排行榜顯示前幾名
  district_top_n: 20

  # 重複職缺排行榜顯示前幾名
  duplicate_top_n: 20

  # 技術統計時要排除的項目
  ignore_technologies:
    - 未取得
    - 提升專業能力